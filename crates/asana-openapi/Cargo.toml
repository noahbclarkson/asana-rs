[package]
name = "asana-openapi"
description = "Typed models, endpoint descriptors, field selectors and OAuth scopes generated from Asana's OpenAPI specification. No HTTP client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["asana", "openapi", "api", "generated"]
categories = ["api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/asana-openapi"
exclude = ["/tests/endpoints_shape.rs"]  # reads ../../spec, which is not in the package

[dependencies]
bon.workspace = true
bytes.workspace = true
rust_decimal.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true

[package.metadata.docs.rs]
# No cargo features and no platform-specific API: one target is the whole documentation.
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
