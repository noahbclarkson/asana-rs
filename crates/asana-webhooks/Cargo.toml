[package]
name = "asana-webhooks"
description = "Receive Asana webhooks: the handshake, signature verification and typed events. No HTTP client and no web framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["asana", "webhooks", "hmac", "signature"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"
documentation = "https://docs.rs/asana-webhooks"

[dependencies]
asana-openapi.workspace = true
hex.workspace = true
hmac.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true
base64.workspace = true
rand.workspace = true
# The receiver: `Sink` for `mpsc::Sender<Delivery>`, and a span around each call.
tokio.workspace = true
tracing.workspace = true

[package.metadata.docs.rs]
# No cargo features and no platform-specific API: one target is the whole documentation.
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
