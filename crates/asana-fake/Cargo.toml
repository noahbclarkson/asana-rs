[package]
name = "asana-fake"
description = "An in-memory Asana for tests: a stateful fake behind asana-client's transport, with signed webhook deliveries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["asana", "fake", "testing", "mock"]
categories = ["development-tools::testing", "api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/asana-fake"

[dependencies]
asana-openapi.workspace = true
asana-webhooks.workspace = true
asana-client.workspace = true
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
# Splitting a request's URL into its path and decoded query pairs.
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
# No cargo features and no platform-specific API: one target is the whole documentation.
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
