# What the dependency tree may contain. CI runs `cargo deny check` on every pull request and
# weekly on `main`; run it locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
# The RustSec advisory database (the default source), fetched on every run. Every vulnerability,
# unmaintained crate and unsound crate fails the check unless it is listed below with a reason.
yanked = "deny"
ignore = [
    # `unsafe-libyaml`, archived by its author, reaches only `xtask` (the generator, never
    # published) through `serde_yaml_ng`, and parses only the vendored specification and the
    # overlays in this repository. No published crate depends on it.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained; reaches only the unpublished generator, which parses this repository's own files" },
]

[licenses]
version = 2
# Exactly the licences the tree needs (`cargo deny list` shows which crate needs which). A new
# licence is a decision, so it fails the check until it is added here.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# `xtask` is `publish = false` and never distributed.
ignore = true

[bans]
# Two major versions of one crate cost compile time but are often unavoidable while the ecosystem
# moves; they are reported, not refused. `cargo tree -d` lists them.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
