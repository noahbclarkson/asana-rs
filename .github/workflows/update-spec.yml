# Weekly: fetch Asana's latest published specification, regenerate the code and docs/coverage.md,
# run the checks, and propose the result as a pull request labelled `spec update`, with a summary
# of what Asana changed (`cargo xtask spec-diff`).
#
# - Nothing changes when upstream has not moved past the commit in spec/UPSTREAM.
# - A stale overlay (its target is gone, its update changes nothing, or the target is not as its
#   `x-expect` says) fails `cargo xtask gen`, and so this run, with the overlay's
#   file name and target in the log and the run summary. Nothing is proposed until it is fixed.
# - A failing check does not stop the pull request (its body says which checks failed), but the
#   run itself then fails, so the failure is noticed.
# - Pull requests opened with GITHUB_TOKEN do not start other workflows: run CI on the
#   `spec-update` branch from the Actions tab, or close and reopen the pull request.
#
# The repository must allow GitHub Actions to create pull requests (Settings > Actions > General >
# Workflow permissions).

name: Update Asana's specification

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-spec
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  update:
    name: fetch, regenerate, check, propose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # push the `spec-update` branch
      pull-requests: write # open or update its pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find upstream's latest specification
        id: upstream
        run: |
          set -euo pipefail
          # spec/UPSTREAM: "source: <repository URL>  (<path in it>)", "commit: <sha>", ...
          repository="$(sed -n 's/^source: *\([^ ]*\).*$/\1/p' spec/UPSTREAM)"
          file="$(sed -n 's/^source: .*(\(.*\))$/\1/p' spec/UPSTREAM)"
          current="$(sed -n 's/^commit: *\([0-9a-f]*\)$/\1/p' spec/UPSTREAM)"
          if [ -z "$repository" ] || [ -z "$file" ] || [ -z "$current" ]; then
            echo "::error file=spec/UPSTREAM::expected 'source: <url>  (<path>)' and 'commit: <sha>' lines"
            exit 1
          fi
          git clone --quiet --filter=blob:none --no-checkout "$repository" "$RUNNER_TEMP/upstream"
          latest="$(git -C "$RUNNER_TEMP/upstream" log -1 --format=%H -- "$file")"
          committed="$(git -C "$RUNNER_TEMP/upstream" log -1 --format=%cs -- "$file")"
          {
            echo "file=$file"
            echo "latest=$latest"
            echo "short=${latest:0:12}"
            echo "committed=$committed"
          } >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The vendored specification is upstream's latest ($current)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace the vendored specification
        if: steps.upstream.outputs.changed == 'true'
        env:
          FILE: ${{ steps.upstream.outputs.file }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          COMMITTED: ${{ steps.upstream.outputs.committed }}
        run: |
          set -euo pipefail
          cp spec/asana_oas.yaml "$RUNNER_TEMP/previous.yaml"
          git -C "$RUNNER_TEMP/upstream" show "$LATEST:$FILE" > spec/asana_oas.yaml
          sed -i \
            -e "s/^commit: .*/commit: $LATEST/" \
            -e "s/^committed: .*/committed: $COMMITTED/" \
            -e "s/^fetched: .*/fetched: $(date -u +%F)/" \
            spec/UPSTREAM

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        if: steps.upstream.outputs.changed == 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.upstream.outputs.changed == 'true'
        with:
          save-if: false

      - name: Summarise what Asana changed
        if: steps.upstream.outputs.changed == 'true'
        run: cargo xtask spec-diff "$RUNNER_TEMP/previous.yaml" spec/asana_oas.yaml > "$RUNNER_TEMP/changes.md"

      - name: Regenerate (fails when an overlay no longer applies)
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -uo pipefail
          if ! cargo xtask gen 2> "$RUNNER_TEMP/gen.log"; then
            cat "$RUNNER_TEMP/gen.log"
            {
              echo "## Regeneration failed"
              echo
              echo "Usually an overlay in spec/overlays/ whose target upstream has changed or removed:"
              echo
              echo '```'
              cat "$RUNNER_TEMP/gen.log"
              echo '```'
              echo
              cat "$RUNNER_TEMP/changes.md"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::cargo xtask gen failed; see the run summary"
            exit 1
          fi

      - name: Regenerate the coverage page
        if: steps.upstream.outputs.changed == 'true'
        run: cargo run --quiet --locked -p asana-client --example coverage > docs/coverage.md

      - name: Run the checks
        id: checks
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -uo pipefail
          failed=0
          results="$RUNNER_TEMP/checks.md"
          : > "$results"
          check() {
            local name="$1"; shift
            if "$@" > "$RUNNER_TEMP/check.log" 2>&1; then
              echo "- [x] \`$name\`" >> "$results"
            else
              failed=1
              cat "$RUNNER_TEMP/check.log"
              {
                echo "- [ ] \`$name\` **failed**"
                echo
                echo '  ```'
                tail -n 40 "$RUNNER_TEMP/check.log" | sed 's/^/  /'
                echo '  ```'
              } >> "$results"
            fi
          }
          check "cargo fmt --all -- --check" cargo fmt --all -- --check
          check "cargo clippy --workspace --all-targets -- -D warnings" cargo clippy --workspace --all-targets --locked -- -D warnings
          check "cargo test --workspace" cargo test --workspace --locked
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Write the pull request's body
        if: steps.upstream.outputs.changed == 'true'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
          COMMITTED: ${{ steps.upstream.outputs.committed }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/body.md"
          {
            echo "Asana's specification at upstream commit \`$LATEST\` (committed $COMMITTED), regenerated with the overlays in \`spec/overlays/\`."
            echo
            echo "A removed operation or field, or a changed shape that the generated code exposes, is a breaking change and needs a minor version bump while the crates are 0.x (see CONTRIBUTING.md, Versioning). Additions are not breaking: the generated types are \`#[non_exhaustive]\`."
            echo
            echo "## Checks run in this workflow"
            echo
            cat "$RUNNER_TEMP/checks.md"
            echo
            echo "CI does not start on its own for this pull request: run it on the \`spec-update\` branch from the Actions tab, or close and reopen the pull request."
            echo
            cat "$RUNNER_TEMP/changes.md"
          } > "$body"
          # GitHub refuses a body over 65,536 characters.
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            head -c 60000 "$body" > "$body.cut"
            printf "\n\n(Cut short: run \`cargo xtask spec-diff\` locally for the whole list.)\n" >> "$body.cut"
            mv "$body.cut" "$body"
          fi
          cat "$body" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the pull request
        if: steps.upstream.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: spec-update
          delete-branch: true
          add-paths: |
            spec/
            crates/asana-openapi/src/generated/
            docs/coverage.md
          commit-message: "chore(spec): update Asana's specification to ${{ steps.upstream.outputs.short }}"
          title: "chore(spec): update Asana's specification to ${{ steps.upstream.outputs.short }}"
          body-path: ${{ runner.temp }}/body.md
          labels: spec update

      - name: Fail when a check failed
        if: steps.checks.outputs.failed == '1'
        run: |
          echo "::error::a check failed on the regenerated code; the pull request lists which"
          exit 1
